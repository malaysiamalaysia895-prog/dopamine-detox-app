name: Flutter Build APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install Packages
        working-directory: flutter_export
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_export
        run: flutter build apk --release

      - name: Build AAB
        working-directory: flutter_export
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechTycoonMerge-apk-${{ github.run_number }}
          path: flutter_export/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TechTycoonMerge-aab-${{ github.run_number }}
          path: flutter_export/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

