name: Build Pirates 3D APK

on:
  push:
    branches: [Pirates-3d]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Install Capacitor CLI + Android
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Remove stale android directory (if any)
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Fix Kotlin duplicate classes conflict
        run: |
          cat >> android/build.gradle << 'GRADLE_FIX'

subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
                details.because 'kotlin-stdlib-jdk7/jdk8 merged into kotlin-stdlib since 1.8'
            }
        }
    }
}
GRADLE_FIX

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pirates-boss-fight-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && echo "APK size: $(du -sh $APK | cut -f1)" || echo "APK not found"
