name: Build Multiverse Crash Android App

on:
  push:
    branches: [ neon-game ]
  workflow_dispatch:

jobs:
  build:
    name: Build signed Android APK/AAB (Capacitor WebView wrapper)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install wrapper dependencies
        working-directory: mobile-app
        run: npm install

      - name: Copy latest game into the wrapper's web assets
        run: |
          rm -rf mobile-app/www
          mkdir -p mobile-app/www
          cp -r game/* mobile-app/www/

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Decode signing keystore
        working-directory: mobile-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.NEON_GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "No NEON_GAME_KEYSTORE_BASE64 secret set - build will be unsigned (not upload-ready for Play Store)."
          fi

      - name: Write keystore.properties
        working-directory: mobile-app/android
        env:
          KEY_ALIAS: ${{ secrets.NEON_GAME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEON_GAME_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.NEON_GAME_STORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.NEON_GAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties
          else
            echo "Skipping keystore.properties - no signing secrets configured"
          fi

      - name: Build release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB (Play Store upload format)
        working-directory: mobile-app/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect build outputs
        run: |
          mkdir -p dist
          cp mobile-app/android/app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp mobile-app/android/app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiverseCrash-APK-${{ github.run_number }}
          path: dist/*.apk

      - name: Upload AAB (upload this one to Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: MultiverseCrash-AAB-${{ github.run_number }}
          path: dist/*.aab

      - name: Build summary
        run: |
          echo "### Multiverse Crash Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK is for installing directly on a device / sideloading." >> "$GITHUB_STEP_SUMMARY"
          echo "- AAB (App Bundle) is the file to upload to Google Play Console." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ secrets.NEON_GAME_KEYSTORE_BASE64 }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No signing secrets found — this build is UNSIGNED and cannot be uploaded to Play Console yet. Add the NEON_GAME_* secrets in repo Settings > Secrets and Actions, then re-run." >> "$GITHUB_STEP_SUMMARY"
          fi
